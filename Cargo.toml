[workspace]
resolver = "2"
members = [
    "crates/md2pdf-domain",
    "crates/md2pdf-convert",
    "crates/md2pdf-typeset",
    "crates/md2pdf-paths",
    "crates/md2pdf-template",
    "crates/md2pdf-app",
    # The only member that cannot be built in the container: `eframe` links system GL/X11
    # libraries this image does not have. It is typechecked here against the vendored
    # sources and linked on the host. See design/plan-app.md.
    "crates/md2pdf-gui",
    # macOS-only at runtime, but a workspace member everywhere: it is checked for
    # aarch64-apple-darwin from the container, which is the whole reason it is a
    # separate crate. See its lib.rs.
    "crates/md2pdf-mac",
    "crates/md2pdf-engine",
    "crates/md2pdf-cli",
]
# Spikes are throwaway experiments with their own pinned deps. They are not
# part of the product and must not be built or linted with it.
exclude = ["spikes"]

# Pinned exactly. The typst crate API churns across releases (8 breaking changes
# observed in ~200 lines going to 0.15.1). Upgrades are a scheduled task with a
# runbook — never a routine `cargo update`. See docs/typst-upgrade.md.
[workspace.dependencies]
typst         = "=0.15.1"
typst-layout  = "=0.15.1"
typst-pdf     = "=0.15.1"
typst-render  = "=0.15.1"
typst-kit     = { version = "=0.15.1", features = ["embedded-fonts"] }
# Pinned exactly, like the typst crates: `comemo`'s cache is process-global and we now
# call `evict` on it (F3), so a version skew between the crate typst memoises through and
# the crate we evict through would silently stop evicting anything.
comemo        = "=0.5.1"
pulldown-cmark = "0.12"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
toml          = { version = "0.8", default-features = false, features = ["parse", "display"] }
thiserror     = "2"

# Full debuginfo made the linker run out of memory. Each test binary statically links
# ~250 crates of the typst graph, and linking several at once got `ld` killed by the
# OOM killer (signal 9) — intermittently, so it looked like a flake before it was
# traced. Line tables keep backtraces and panic locations, which is all the tests need,
# and cut linker memory enough that the workspace builds in parallel again.
[profile.dev]
debug = "line-tables-only"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"   # deliberately undecided: freeware vs paid is still open
