[package]
name = "md2pdf-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "md2pdf-gui"
path = "src/main.rs"

[dependencies]
# The only crate in the workspace that depends on a GUI toolkit, and the only one that
# cannot be built in the container: eframe links system GL/X11 libraries this image does
# not have. Everything it draws is decided in `md2pdf-app`, which is why this stays thin.
# 0.29.1, confirmed by `cargo add` resolving to it with network available — not the
# guess it started as. It was written here from memory, then asserted to be two years
# stale, and neither claim was checkable offline; the second one cost a re-vendor to
# disprove. `vendor/eframe/Cargo.toml` is the thing to read.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

md2pdf-app = { path = "../md2pdf-app" }
md2pdf-domain = { path = "../md2pdf-domain" }
md2pdf-engine = { path = "../md2pdf-engine" }
md2pdf-paths = { path = "../md2pdf-paths" }
md2pdf-template = { path = "../md2pdf-template" }
